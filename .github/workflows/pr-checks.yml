name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: |
          ruff format --check src tests

      - name: Ruff lint
        run: |
          ruff check src tests

      - name: Tests
        run: |
          pytest

      - name: Build package
        run: |
          python -m build

  summary:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post PR summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number: pull_number } = context.issue;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100,
              },
            );

            const groupedByStatus = files.reduce((acc, file) => {
              const status = file.status || "unknown";
              acc[status] = (acc[status] || 0) + 1;
              return acc;
            }, {});

            const filesByStatus = Object.entries(groupedByStatus)
              .sort()
              .map(([status, count]) => `- **${status}**: ${count}`)
              .join("\n") || "- Keine Dateiveränderungen ermittelt.";

            const commentBody = [
              "## PR-Checks abgeschlossen",
              "", 
              `**Workflow:** ${context.workflow}`,
              `**Run:** [${context.payload.repository.full_name} #${context.runNumber}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              "",
              "### Geänderte Dateien",
              filesByStatus,
              "",
              "### Nächste Schritte",
              "- Code-Review auf Plausibilität prüfen",
              "- Sicherheits-/Policy-Verhalten gegen Plan abgleichen",
              "- Bei Bedarf Demo-Run via `playwright` optional durchführen",
              "",
              "*Automatisch erstellt von Hermes CI Workflow*",
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: commentBody,
            });
