[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-live-web-ui-controller"
description = "Executable Operator-Loop for live, verified web-UI interactions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
version = "0.1.0"
keywords = ["hermes", "web-ui", "browser", "automation", "verification"]
authors = [{ name = "Pavel" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typing-extensions>=4.10; python_version<'3.13'"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.8",
]

[project.scripts]
hermes-live-web-ui = "hermes_live_ui_controller.cli:main"

[project.urls]
Homepage = "https://github.com/erasercyb/hermes-live-web-ui-controller"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.coverage.run]
branch = true
source = ["hermes_live_ui_controller"]
